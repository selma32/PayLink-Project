services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: paylink
      POSTGRES_PASSWORD: paylink_dev
      POSTGRES_DB: paylink
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylink"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=paylink;Username=paylink;Password=paylink_dev"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data: